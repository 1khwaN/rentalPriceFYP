<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card p-4 shadow">
        <h2 class="text-success">🏠 Predicted Monthly Rent</h2>
        <h1 class="display-4">RM {{ rent }}</h1>

        <hr>
        <h4>Property Details</h4>
        <p><strong>City:</strong> {{ city }}</p>
        <p><strong>Region:</strong> {{ region }}</p>
        <p><strong>Size:</strong> {{ size }} sqft</p>

        <h4 class="mt-4">📍 Recommended Properties</h4>
        <ul>
            {% for r in recommendations %}
            <li>{{ r.name }} — RM {{ r.rent }}</li>
            {% endfor %}
        </ul>

        {% if map_path %}
        <h4 class="mt-4">📌 Location Map</h4>
        <iframe src="/maps/{{ map_path }}" width="100%" height="500px"></iframe>
        {% endif %}


        <a href="/predict_form" class="btn btn-secondary mt-3">Back</a>
    </div>

</div>

</body>
</html>
