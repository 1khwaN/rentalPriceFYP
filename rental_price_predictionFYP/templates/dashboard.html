<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div class="container mt-4">
<h1 class="text-center">Rental Price Prediction Dashboard</h1>
<a href="/predict_form" class="btn btn-primary">Start Prediction</a>
<h3 class="mt-4">Model Performance</h3>
<canvas id="r2chart"></canvas>
</div>
<script>
new Chart(document.getElementById('r2chart'), {
    type:'bar',
    data:{
        labels:['Random Forest','XGBoost','Hybrid'],
        datasets:[{label:'R²',data:[0.92,0.94,0.96]}]
    }
});
</script>
</body>
</html>
